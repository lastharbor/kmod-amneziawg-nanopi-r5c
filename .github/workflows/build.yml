name: build-ipk

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Native aarch64 runner: matches the target arch, no cross-compile needed,
    # and reproduces the build that was verified on the device.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            kmod cpio rsync curl ca-certificates git gzip

      - name: Cache kernel tarball
        uses: actions/cache@v4
        with:
          path: build/kernel.tar.gz
          key: kernel-nanopi6-v6.1.y-${{ hashFiles('config/config.gz') }}

      - name: Build module + package .ipk
        run: |
          chmod +x build.sh package.sh make-feed.sh
          ./build.sh

      - name: Generate opkg feed (Pages)
        run: ./make-feed.sh

      - name: Show package info
        run: |
          ls -la dist/
          for f in dist/*.ipk; do echo "== $f =="; tar -xzOf "$f" control.tar.gz | tar -xzO ./control; done

      - name: Upload .ipk artifact
        uses: actions/upload-artifact@v4
        with:
          name: kmod-amneziawg-ipk
          path: dist/*.ipk
          if-no-files-found: error

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipk
          generate_release_notes: true

  deploy-pages:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
