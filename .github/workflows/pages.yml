name: pages

# Publishes the opkg feed (Packages index + .ipk + landing page) to GitHub
# Pages. Runs only from main, so it never conflicts with tag-based releases.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent Pages deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-feed:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            kmod cpio rsync curl ca-certificates git gzip

      - name: Cache kernel tarball
        uses: actions/cache@v4
        with:
          path: build/kernel.tar.gz
          key: kernel-nanopi6-v6.1.y-${{ hashFiles('config/config.gz') }}

      - name: Build module + package .ipk
        run: |
          chmod +x build.sh package.sh make-feed.sh
          ./build.sh

      - name: Generate opkg feed
        run: ./make-feed.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build-feed
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
