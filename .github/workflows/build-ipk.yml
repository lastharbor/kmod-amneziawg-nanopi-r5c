name: build-ipk

# Builds the kernel module and packages the .ipk.
# - PR / main push: build + upload artifact (validation)
# - tag v*:         build + publish GitHub Release with the .ipk

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Native aarch64 runner: matches the target arch (no cross-compile) and
    # reproduces the build verified on the device.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            kmod cpio rsync curl ca-certificates git gzip

      - name: Cache kernel tarball
        uses: actions/cache@v4
        with:
          path: build/kernel.tar.gz
          key: kernel-nanopi6-v6.1.y-${{ hashFiles('config/config.gz') }}

      - name: Build module + package .ipk
        run: |
          chmod +x build.sh package.sh
          ./build.sh

      - name: Show package info
        run: |
          ls -la dist/
          for f in dist/*.ipk; do echo "== $f =="; tar -xzOf "$f" control.tar.gz | tar -xzO ./control; done

      - name: Upload .ipk artifact
        uses: actions/upload-artifact@v4
        with:
          name: kmod-amneziawg-ipk
          path: dist/*.ipk
          if-no-files-found: error

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipk
          generate_release_notes: true
